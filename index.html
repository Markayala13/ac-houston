<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XMAX AIRCONDITIONER - Houston</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>

  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin="anonymous"></script>

  <!-- Framer Motion -->
  <script src="https://unpkg.com/framer-motion@11.11.17/dist/framer-motion.js"></script>
  <script>
    window.onerror = function(msg, url, line, col, error) {
      document.body.innerHTML += '<div style="color:red; background:white; position:fixed; top:0; left:0; z-index:9999; padding:20px; font-family:monospace; width:100%">ERROR: ' + msg + '<br>Line: ' + line + '</div>';
    };
  </script>
  <!-- Lucide Icons (using umd) -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Barlow:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            heading: ['"Instrument Serif"', 'serif'],
            body: ['"Barlow"', 'sans-serif'],
          },
          colors: {
            ice: '#00B4FF',
            fire: '#FF3C00',
            chrome: '#C0C0C0',
            light: '#F8F9FA'
          },
          borderRadius: {
            DEFAULT: '9999px',
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #F8F9FA;
      color: #1A1A1A;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }

    /* Light Theme Liquid Glass */
    .liquid-glass {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 1);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05), inset 0 1px 2px rgba(255, 255, 255, 0.8);
      position: relative;
      overflow: hidden;
    }

    .liquid-glass-strong {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 1);
      box-shadow: 0 20px 40px rgba(0, 180, 255, 0.1), inset 0 2px 4px rgba(255, 255, 255, 0.9);
      position: relative;
      overflow: hidden;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #F8F9FA; }
    ::-webkit-scrollbar-thumb { background: #C0C0C0; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #00B4FF; }

    /* For lucide icons mapping later */
    .icon-placeholder { width: 24px; height: 24px; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo, useContext } = React;
    const { motion, useInView, useScroll, useTransform, AnimatePresence } = window.Motion;

    const translations = {
      en: {
        nav: { home: 'Home', services: 'Services', projects: 'Projects', gallery: 'Gallery', testimonials: 'Testimonials', contact: 'Contact' },
        hero: { badgeLabel: 'Premium', badgeText: 'Commercial & Residential Service', title: 'The Perfect Air for Your Home in Houston', desc: 'Experts in AC repair, maintenance, and Minisplit installation. Absolute comfort with a professional, serious, and reliable style.', btnServices: 'View Services', btnContact: 'Contact Us Now' },
        marquee: { subtitle: 'Certified to install & service', services: ["AC Repair", "Minisplit Installation", "Preventive Maintenance", "Heating", "Cooling"] },
        services: { subtitle: 'Our Specialty', title: 'Climate Solutions', items: [

            { title: "Minisplit Install", desc: "High-efficiency ductless systems. Perfect zoning without breaking walls." },
            { title: "Maintenance", desc: "Extend your equipment's lifespan and save energy with our annual plans." },
            { title: "Heating", desc: "Heat pumps and furnaces ready to protect your family from the Texas winter." },
            { title: "Cooling", desc: "Latest generation central systems for total and silent comfort." }
        ]},
        stats: { title1: 'Licensed, Insured, ', title2: 'Houston-Proven', items: ["Installations", "Availability", "Years Experience", "Licensed & Insured"] },
        gallery: { subtitle: 'Our Work', title: 'Projects & Gallery', mainTitle: 'Commercial & Residential Installation', mainDesc: 'Professional and high-quality work guaranteed. Detailed inspection, precise diagnosis, and flawless installation on roofs and residential areas throughout Houston.', btnDetails: 'See more details' },
        testimonials: { title: 'What our clients say', reviews: [
            { name: "Michael T.", text: "Fast, clean, and very professional. They solved my problem the same day." },
            { name: "Sarah J.", text: "Installed 3 minisplits in my office. Impeccable work and super quiet equipment." },
            { name: "David R.", text: "Excellent maintenance service. You can tell the difference in air quality and my power bill." }
        ]},
        contact: { support: '24/7 Support', title: 'Schedule Your Visit', desc: 'Our experts are ready to assist you anywhere in Houston. No obligation quotes.', phoneTitle: 'Phone / WhatsApp', areaTitle: 'Service Area', areaDesc: 'Houston, TX & Surrounding Areas', form: { name: 'Name', phone: 'Phone', email: 'Email', message: 'How can we help you?', submit: 'Send Message' } },
        cta: { title: 'Ready to Fix Your Comfort?', desc: 'Free estimates on all installations. No hidden fees. Financing available.', btn: 'Schedule Your Free Estimate', tags: ['Licensed & Insured', 'Serving all of Greater Houston', 'Hablamos Español'] },
        footer: { desc: 'Expert HVAC services in Houston, TX. Delivering premium comfort, high efficiency, and reliable installations since day one.', contactTitle: 'Contact Us', rights: 'All rights reserved.', designed: 'Designed for excellence.' }
      },
      es: {
        nav: { home: 'Inicio', services: 'Servicios', projects: 'Proyectos', gallery: 'Galería', testimonials: 'Testimonios', contact: 'Contacto' },
        hero: { badgeLabel: 'Premium', badgeText: 'Servicio Comercial y Residencial', title: 'El Aire Perfecto para tu Hogar en Houston', desc: 'Expertos en reparación, mantenimiento e instalación de Minisplit. Confort absoluto con estilo profesional, serio y confiable.', btnServices: 'Ver Servicios', btnContact: 'Contáctanos Ahora' },
        marquee: { subtitle: 'Certificados para instalar y reparar', services: ["Reparación de AC", "Instalación Minisplit", "Mantenimiento Preventivo", "Calefacción", "Enfriamiento"] },
        services: { subtitle: 'Nuestra Especialidad', title: 'Soluciones Climáticas', items: [
            { title: "Reparación de AC", desc: "Diagnóstico rápido y reparación precisa. No pases calor, solucionamos tu problema el mismo día." },
            { title: "Instalación Minisplit", desc: "Sistemas ductless de alta eficiencia. Zonificación perfecta sin romper paredes." },
            { title: "Mantenimiento", desc: "Extiende la vida útil de tus equipos y ahorra energía con nuestros planes anuales." },
            { title: "Calefacción", desc: "Bombas de calor y furnaces listos para proteger a tu familia del invierno en Texas." },
            { title: "Enfriamiento", desc: "Sistemas centrales de última generación para un confort total y silencioso." }
        ]},
        stats: { title1: 'Licenciados, Asegurados, ', title2: 'Probados en Houston', items: ["Instalaciones", "Disponibilidad", "Años Experiencia", "Licenciados y Asegurados"] },
        gallery: { subtitle: 'Nuestro Trabajo', title: 'Proyectos y Galería', mainTitle: 'Instalación Comercial y Residencial', mainDesc: 'Trabajo profesional y de alta calidad garantizado. Inspección detallada, diagnóstico preciso e instalación impecable en techos y áreas residenciales en todo Houston.', btnDetails: 'Ver más detalles' },
        testimonials: { title: 'Lo que dicen nuestros clientes', reviews: [
            { name: "Michael T.", text: "Rápidos, limpios y muy profesionales. Solucionaron mi problema el mismo día." },
            { name: "Sarah J.", text: "Instalaron 3 minisplits en mi oficina. El trabajo impecable y los equipos son súper silenciosos." },
            { name: "David R.", text: "Excelente servicio de mantenimiento. Se nota la diferencia en la calidad del aire y en mi recibo de luz." }
        ]},
        contact: { support: 'Soporte 24/7', title: 'Agenda tu Visita', desc: 'Nuestros expertos están listos para asistirte en todo Houston. Cotización sin compromiso.', phoneTitle: 'Teléfono / WhatsApp', areaTitle: 'Área de Servicio', areaDesc: 'Houston, TX y Alrededores', form: { name: 'Nombre', phone: 'Teléfono', email: 'Correo', message: '¿En qué podemos ayudarte?', submit: 'Enviar Mensaje' } },
        cta: { title: '¿Listo para Mejorar tu Confort?', desc: 'Estimaciones gratis en instalaciones. Sin cuotas ocultas. Financiamiento disponible.', btn: 'Agenda tu Estimado Gratis', tags: ['Licenciados y Asegurados', 'Sirviendo a todo Houston', 'Se Habla Español'] },
        footer: { desc: 'Servicios expertos de HVAC en Houston, TX. Brindando confort premium, alta eficiencia e instalaciones confiables desde el primer día.', contactTitle: 'Contáctanos', rights: 'Todos los derechos reservados.', designed: 'Diseñado para la excelencia.' }
      }
    };

    const LanguageContext = React.createContext();

    function LanguageProvider({ children }) {
      const [lang, setLang] = useState('en');
      return (
        <LanguageContext.Provider value={{ lang, setLang, t: translations[lang] }}>
          {children}
        </LanguageContext.Provider>
      );
    }

    // Suppress benign Framer Motion warnings
    const originalConsoleError = console.error;
    console.error = (...args) => {
      if (typeof args[0] === 'string' && args[0].includes('key')) return;
      originalConsoleError.apply(console, args);
    };

    // --- BlurText Component ---
    function BlurText({ text, className }) {
      const ref = useRef(null);
      const isInView = useInView(ref, { once: true, amount: 0.1 });
      const words = text.split(" ");
      
      const child = {
        hidden: { filter: "blur(10px)", opacity: 0, y: 30 },
        visible: (i) => ({
          filter: ["blur(10px)", "blur(0px)"],
          opacity: [0, 1],
          y: [30, 0],
          transition: { duration: 0.6, delay: (i * 100) / 1000, ease: "easeOut" }
        })
      };

      return (
        <p ref={ref} className={className} style={{ display: "flex", flexWrap: "wrap", rowGap: "0.1em" }}>
          {words.map((word, i) => (
            <motion.span key={i} custom={i} variants={child} initial="hidden" animate={isInView ? "visible" : "hidden"} style={{ marginRight: "0.28em", display: "inline-block" }}>
              {word}
            </motion.span>
          ))}
        </p>
      );
    }

    // --- Particle System (CSS/Framer Motion) ---
    function ParticleSystem() {
      const particles = useMemo(() => {
        return Array.from({ length: 40 }).map((_, i) => ({
          id: i,
          isCold: i % 2 === 0,
          size: Math.random() * 8 + 4,
          x: Math.random() * 100,
          y: Math.random() * 100,
          duration: Math.random() * 10 + 10,
          delay: Math.random() * 5
        }));
      }, []);

      return (
        <div className="absolute inset-0 pointer-events-none overflow-hidden z-0">
          {particles.map(p => (
            <motion.div
              key={p.id}
              className="absolute rounded-full opacity-60 mix-blend-multiply"
              style={{
                width: p.size,
                height: p.size,
                left: `${p.x}%`,
                top: `${p.y}%`,
                background: p.isCold ? 'radial-gradient(circle, #00B4FF 0%, rgba(0,180,255,0) 70%)' : 'radial-gradient(circle, #FF3C00 0%, rgba(255,60,0,0) 70%)',
                boxShadow: p.isCold ? '0 0 10px #00B4FF' : '0 0 10px #FF3C00'
              }}
              animate={{
                y: [0, -200],
                x: [0, Math.random() * 50 - 25],
                opacity: [0, 0.8, 0]
              }}
              transition={{
                duration: p.duration,
                repeat: Infinity,
                delay: p.delay,
                ease: "linear"
              }}
            />
          ))}
        </div>
      );
    }

    // --- Navbar ---
    function Navbar() {
      const { lang, setLang, t } = useContext(LanguageContext);
      const [scrolled, setScrolled] = useState(false);
      const [menuOpen, setMenuOpen] = useState(false);

      useEffect(() => {
        const handleScroll = () => setScrolled(window.scrollY > 50);
        window.addEventListener('scroll', handleScroll);
        return () => window.removeEventListener('scroll', handleScroll);
      }, []);

      const navLinks = [
        { id: 'inicio', label: t.nav.home },
        { id: 'servicios', label: t.nav.services },
        { id: 'proyectos', label: t.nav.projects },
        { id: 'galeria', label: t.nav.gallery },
        { id: 'testimonials', label: t.nav.testimonials }
      ];

      return (
        <>
          <nav className={`fixed top-4 left-0 w-full px-4 lg:px-16 z-50 transition-all duration-500 flex justify-between items-center`}>
            {/* Logo Container */}
            <div className="h-14 liquid-glass px-4 flex items-center justify-center rounded-full z-50 relative">
              <img src="assets/logo.jpeg" alt="XMAX" className="h-10 w-auto object-contain mix-blend-multiply" onError={(e) => { e.target.style.display='none'; e.target.nextSibling.style.display='block'; }} />
              <span style={{display: 'none'}} className="font-heading italic text-xl px-2 text-[#00B4FF] font-bold">XMAX<span className="text-[#FF3C00]">AC</span></span>
            </div>

            {/* Center Links (Desktop) */}
            <div className="hidden lg:flex liquid-glass px-2 py-1 items-center gap-1 rounded-full">
              {navLinks.map((item) => (
                <a key={item.id} href={`#${item.id}`} className="px-4 py-2 text-sm font-medium text-gray-700 font-body hover:text-[#00B4FF] transition-colors rounded-full hover:bg-white/50">
                  {item.label}
                </a>
              ))}
              <div className="w-[1px] h-4 bg-gray-300 mx-2"></div>
              <button 
                onClick={() => setLang(lang === 'en' ? 'es' : 'en')} 
                className="px-3 py-2 text-xs font-bold font-body text-gray-500 hover:text-[#00B4FF] transition-colors tracking-widest"
              >
                {lang === 'en' ? 'EN | ESP' : 'ESP | EN'}
              </button>
              <a href="#contacto" className="bg-[#1A1A1A] text-white px-5 py-2 text-sm font-medium font-body rounded-full ml-2 shadow-md hover:bg-black transition-colors flex items-center gap-2">
                {t.nav.contact}
                <svg className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M7 17L17 7M7 7h10v10"/></svg>
              </a>
            </div>

            {/* Right Spacer / Mobile Actions */}
            <div className="flex items-center gap-2 lg:hidden z-50 relative">
              <button 
                onClick={() => setLang(lang === 'en' ? 'es' : 'en')} 
                className="liquid-glass-strong h-10 px-4 rounded-full text-xs font-bold font-body text-gray-800 hover:text-[#00B4FF] transition-colors shadow-sm"
              >
                {lang === 'en' ? 'ESP' : 'ENG'}
              </button>
              <button onClick={() => setMenuOpen(!menuOpen)} className="liquid-glass-strong h-14 w-14 rounded-full flex items-center justify-center cursor-pointer hover:bg-white/50 transition-colors">
                {menuOpen ? (
                  <svg className="w-6 h-6 text-[#FF3C00]" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
                ) : (
                  <svg className="w-6 h-6 text-gray-800" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
                )}
              </button>
            </div>
            <div className="hidden lg:block w-14 h-14"></div>
          </nav>

          {/* Mobile Menu Overlay */}
          <AnimatePresence>
            {menuOpen && (
              <motion.div 
                initial={{ opacity: 0, y: -20 }}
                animate={{ opacity: 1, y: 0 }}
                exit={{ opacity: 0, y: -20 }}
                className="fixed inset-0 z-40 bg-white/95 backdrop-blur-xl flex flex-col justify-center items-center lg:hidden"
              >
                <div className="flex flex-col gap-6 text-center">
                  <button 
                    onClick={() => setLang(lang === 'en' ? 'es' : 'en')} 
                    className="font-heading italic text-3xl text-[#00B4FF] transition-colors mb-4 border border-[#00B4FF] rounded-full px-6 py-2"
                  >
                    {lang === 'en' ? 'Cambiar a Español' : 'Switch to English'}
                  </button>
                  {navLinks.map((item) => (
                    <a 
                      key={item.id} 
                      href={`#${item.id}`} 
                      onClick={() => setMenuOpen(false)}
                      className="font-heading italic text-4xl text-[#1A1A1A] hover:text-[#00B4FF] transition-colors"
                    >
                      {item.label}
                    </a>
                  ))}
                  <a 
                    href="#contacto" 
                    onClick={() => setMenuOpen(false)}
                    className="mt-8 bg-gradient-to-r from-[#00B4FF] to-[#FF3C00] text-white px-10 py-4 text-xl font-bold font-body rounded-full shadow-xl shadow-blue-500/20"
                  >
                    {t.nav.contact}
                  </a>
                </div>
              </motion.div>
            )}
          </AnimatePresence>
        </>
      );
    }

    // --- Hero Section ---
    function Hero() {
      const { t } = useContext(LanguageContext);
      return (
        <section id="inicio" className="relative w-full min-h-[100vh] flex flex-col justify-center items-center overflow-hidden bg-gradient-to-b from-[#F8F9FA] to-white pt-24">
          <ParticleSystem />
          
          <div className="relative z-10 w-full max-w-7xl mx-auto px-4 lg:px-16 flex flex-col lg:flex-row items-center justify-between gap-12">
            
            {/* Left Content */}
            <div className="flex-1 text-center lg:text-left flex flex-col items-center lg:items-start">
              <motion.div 
                initial={{ opacity: 0, y: 20 }} animate={{ opacity: 1, y: 0 }} transition={{ delay: 0.4 }}
                className="liquid-glass rounded-full px-4 py-1.5 inline-flex items-center gap-3 mb-8"
              >
                <span className="bg-[#00B4FF] text-white px-2 py-0.5 rounded-full text-[10px] font-bold uppercase tracking-wider">{t.hero.badgeLabel}</span>
                <span className="text-xs font-body font-semibold text-gray-600 uppercase tracking-widest">{t.hero.badgeText}</span>
              </motion.div>

              <BlurText 
                text={t.hero.title}
                className="font-heading italic text-5xl md:text-7xl lg:text-[6rem] text-[#1A1A1A] leading-[0.9] tracking-[-2px] max-w-2xl"
              />

              <motion.p 
                initial={{ opacity: 0, y: 20 }} animate={{ opacity: 1, y: 0 }} transition={{ delay: 0.8 }}
                className="mt-6 text-lg md:text-xl text-gray-600 max-w-xl font-body font-light leading-relaxed"
              >
                {t.hero.desc}
              </motion.p>

              <motion.div 
                initial={{ opacity: 0, y: 20 }} animate={{ opacity: 1, y: 0 }} transition={{ delay: 1.1 }}
                className="flex flex-wrap justify-center lg:justify-start gap-4 mt-10"
              >
                <a href="#servicios" className="liquid-glass-strong rounded-full px-8 py-4 text-base font-bold text-[#1A1A1A] hover:bg-white transition-all flex items-center gap-2 group shadow-lg shadow-blue-500/10">
                  {t.hero.btnServices}
                  <svg className="w-5 h-5 group-hover:translate-x-1 transition-transform" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                </a>
                <a href="#contacto" className="bg-gradient-to-r from-[#00B4FF] to-[#FF3C00] rounded-full px-8 py-4 text-base font-bold text-white shadow-xl hover:shadow-2xl hover:-translate-y-0.5 transition-all flex items-center gap-2">
                  {t.hero.btnContact}
                </a>
              </motion.div>
            </div>

            {/* Right Content: Video Hero */}
            <motion.div 
              initial={{ opacity: 0, x: 20 }}
              animate={{ opacity: 1, x: 0 }}
              transition={{ duration: 1, delay: 0.5 }}
              className="flex-1 relative w-full lg:max-w-[50%] flex justify-center items-center"
            >
              <div className="absolute inset-0 bg-gradient-to-tr from-[#00B4FF]/20 to-[#FF3C00]/20 rounded-3xl blur-2xl mix-blend-multiply"></div>
              
              {/* Static Video Player */}
              <div className="relative w-full aspect-video rounded-3xl overflow-hidden shadow-2xl border border-gray-200 bg-black z-10">
                <video 
                  src="assets/hero-video.mp4" 
                  autoPlay 
                  loop 
                  muted 
                  playsInline 
                  className="w-full h-full object-cover"
                  onError={(e) => { e.target.style.display='none'; }}
                ></video>
              </div>
            </motion.div>

          </div>
        </section>
      );
    }

    // --- Infinite Marquee ---
    function InfiniteMarquee() {
      const { t } = useContext(LanguageContext);
      const services = t.marquee.services;
      
      const MarqueeBlock = () => (
        <div className="flex shrink-0 items-center justify-around gap-12 md:gap-24 px-6 md:px-12">
          {services.map((item, i) => (
            <div key={i} className="flex items-center gap-12 md:gap-24">
              <span className="font-heading italic text-4xl md:text-5xl text-gray-300 hover:text-[#00B4FF] transition-colors cursor-default whitespace-nowrap">
                {item}
              </span>
              <span className="text-[#FF3C00] text-2xl">✧</span>
            </div>
          ))}
        </div>
      );

      return (
        <section className="py-12 bg-white relative z-10 border-b border-gray-100 overflow-hidden">
          <div className="text-center mb-8 relative z-20">
            <span className="text-xs md:text-sm font-body font-bold tracking-[0.2em] text-gray-400 uppercase bg-white px-4">
              {t.marquee.subtitle}
            </span>
          </div>
          {/* Fading Edges */}
          <div className="absolute left-0 top-0 w-16 md:w-48 h-full bg-gradient-to-r from-white to-transparent z-10 pointer-events-none"></div>
          <div className="absolute right-0 top-0 w-16 md:w-48 h-full bg-gradient-to-l from-white to-transparent z-10 pointer-events-none"></div>

          <div className="flex overflow-hidden">
            <motion.div 
              className="flex shrink-0"
              animate={{ x: ["0%", "-50%"] }}
              transition={{ repeat: Infinity, ease: "linear", duration: 120 }}
            >
              <MarqueeBlock />
              <MarqueeBlock />
              <MarqueeBlock />
              <MarqueeBlock />
            </motion.div>
          </div>
        </section>
      );
    }

    // --- Services Section ---
    function Services() {
      const { t } = useContext(LanguageContext);
      
      const icons = ["Wrench", "Snowflake", "ShieldCheck", "Sun", "Wind"];
      const colors = ["text-[#FF3C00]", "text-[#00B4FF]", "text-[#C0C0C0]", "text-[#FF3C00]", "text-[#00B4FF]"];
      
      const services = t.services.items.map((item, i) => ({
        ...item,
        icon: icons[i],
        color: colors[i]
      }));

      return (
        <section id="servicios" className="py-24 px-4 lg:px-16 max-w-7xl mx-auto relative z-10">
          <div className="text-center mb-16">
            <span className="text-sm font-body font-bold tracking-widest text-[#00B4FF] uppercase">{t.services.subtitle}</span>

    // --- Animated Counter ---
    function AnimatedCounter({ to, suffix = "", duration = 2.5 }) {
      const nodeRef = useRef(null);
      const inView = useInView(nodeRef, { once: true, amount: 0.5 });
      
      useEffect(() => {
        if (inView && nodeRef.current) {
          const controls = window.Motion.animate(0, to, {
            duration: duration,
            ease: "easeOut",
            onUpdate(value) {
              if (nodeRef.current) {
                nodeRef.current.textContent = Math.floor(value) + suffix;
              }
            }
          });
          return () => controls.stop();
        }
      }, [inView, to, duration, suffix]);

      return <span ref={nodeRef}>0{suffix}</span>;
    }
